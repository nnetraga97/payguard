[project]
name = "payguard-ml"
version = "0.1.0"
description = "Local ML learning workspace for PayGuard."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = []

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
classical = [
  "imbalanced-learn>=0.12,<1.0",
  "matplotlib>=3.8,<4.0",
  "mlflow>=2.12,<4.0",
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<3.0",
  "pyarrow>=15,<23",
  "scikit-learn>=1.4,<2.0",
  "seaborn>=0.13,<1.0",
  "xgboost>=2.0,<4.0"
]
serving = [
  "fastapi>=0.110,<1.0",
  "pydantic>=2.6,<3.0",
  "uvicorn[standard]>=0.27,<1.0"
]
rag = [
  "beautifulsoup4>=4.12,<5.0",
  "pypdf>=4.0,<7.0",
  "sentence-transformers>=3.0,<6.0"
]
deep-learning = [
  "accelerate>=0.28,<2.0",
  "datasets>=2.18,<5.0",
  "torch>=2.2,<3.0",
  "transformers>=4.38,<6.0"
]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.6,<1.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.packages.find]
where = ["src"]
